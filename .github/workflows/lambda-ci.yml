# .github/workflows/lambda-ci.yml
name: lambda-deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build

      # Copy lambda source
      - name: Copy lambda source
        run: |
          cp -r lambda/* build/

      # Package lambda.zip
      - name: Create deployment package
        run: |
          cd build
          zip -r ../lambda.zip .

      # 部署 DEV

      - name: Configure AWS credentials (DEV)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update Lambda function code (DEV)
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://lambda.zip

      # 部署 DEMO（用 demo 那組 GitHub secrets）

      - name: Configure AWS credentials (DEMO)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEMO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEMO }}
          aws-region: ${{ secrets.AWS_REGION }}   # 或 AWS_REGION_DEMO（看你要不要分開）

      - name: Update Lambda function code (DEMO)
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME_DEMO }}" \
            --zip-file fileb://lambda.zip
